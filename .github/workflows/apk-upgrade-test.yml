name: Test in-place QA72 to QA73 update
on:
  push:
    branches: [qa/verify-b72-to-b73]
permissions:
  actions: read
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wait for signed QA73 APKs from the integration build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in {1..90}; do
            gh api repos/$GITHUB_REPOSITORY/actions/runs/45766678424/artifacts --jq '.artifacts[].name' | grep -qx FGallery-0.4.0-R8-universal && exit 0
            sleep 15
          done
          exit 1
      - uses: actions/download-artifact@v4
        with:
          run-id: 45626045287
          github-token: ${{ github.token }}
          pattern: FGallery-0.4.0-R8-*
          path: previous
      - uses: actions/download-artifact@v4
        with:
          run-id: 45766678424
          github-token: ${{ github.token }}
          pattern: FGallery-0.4.0-R8-*
          path: next
      - name: Prepare upgrade test
        run: |
          cat > upgrade.sh <<'SH'
          set -eu
          pkg=com.mistermikhail.fgallery
          abi=universal
          if adb shell getprop ro.product.cpu.abilist | grep -q arm64-v8a; then abi=arm64; fi
          old=$(find "previous/FGallery-0.4.0-R8-$abi" -name '*.apk' -print -quit)
          new=$(find "next/FGallery-0.4.0-R8-$abi" -name '*.apk' -print -quit)
          sha256sum "$old" "$new"
          adb install "$old"
          adb shell dumpsys package "$pkg" > /tmp/before
          grep 'versionCode=72 ' /tmp/before
          adb install -r "$new"
          adb shell dumpsys package "$pkg" > /tmp/after
          grep 'versionCode=73 ' /tmp/after
          a=$(grep -m1 firstInstallTime= /tmp/before)
          test -n "$a" && grep -Fq "$a" /tmp/after
          echo "$abi update OK with same firstInstallTime"
          SH
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: bash upgrade.sh
