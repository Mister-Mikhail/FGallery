name: Android CI

on:
  push:
    branches:
      - feature/quickpic-masonry-mvp
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Install shared test signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode .github/debug-signing/debug.keystore.b64 > "$HOME/.android/debug.keystore"
      - name: Test and build debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FGallery-debug
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FGallery-universal
          path: app/build/outputs/apk/debug/app-universal-debug.apk

  device-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Install shared test signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode .github/debug-signing/debug.keystore.b64 > "$HOME/.android/debug.keystore"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash .github/scripts/device-tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-device-test-results
          path: app/build/reports/androidTests/connected/

  publish-test-update:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, device-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: FGallery-*
          path: artifacts
      - name: Publish verified debug update
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          declared_version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          test "$VERSION_TAG" = "v$declared_version"
          cp artifacts/FGallery-debug/app-arm64-v8a-debug.apk "FGallery-$declared_version-arm64-v8a.apk"
          cp artifacts/FGallery-universal/app-universal-debug.apk "FGallery-$declared_version-universal.apk"
          gh release create "$VERSION_TAG" "FGallery-$declared_version-arm64-v8a.apk" "FGallery-$declared_version-universal.apk" --title "FGallery $declared_version (debug)" --notes-file .github/debug-signing/release-notes.md --latest
