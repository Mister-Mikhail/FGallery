name: FGallery Stage 5 Room catalogue integration

on:
  push:
    branches:
      - feature/fgallery-0.4.0-stage5-catalog
  pull_request:
    branches:
      - feature/fgallery-0.3.3-stage4-raw
  workflow_dispatch:

concurrency:
  group: fgallery-stage5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  r8-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: JVM regression tests and R8 APKs
        run: gradle :app:testDebugUnitTest :app:testReleaseUnitTest :app:assembleRelease :app:assembleMinifiedTest
      - name: Validate mapping, APKs and development signing
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/mapping/release/mapping.txt
          test -s app/build/outputs/apk/release/app-arm64-v8a-release.apk
          for apk in app/build/outputs/apk/release/app-{arm64-v8a,universal}-release.apk; do
            signer=""
            for f in "$ANDROID_HOME"/build-tools/*/apksigner; do
              if [[ -x "$f" ]]; then signer="$f"; fi
            done
            test -n "$signer"
            certificate=$("$signer" verify --print-certs "$apk" | sed -nE 's/^.*certificate SHA-256 digest: ([0-9a-f]{64})$/\1/p')
            test "$certificate" = "ce2293752c0a4a8c844caff57fa3bc28ee9206e927ad311dbcf3a5e71c803eb2"
            du -h "$apk"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FGallery-0.4.0-R8-arm64
          path: app/build/outputs/apk/release/app-arm64-v8a-release.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FGallery-0.4.0-R8-mapping
          path: app/build/outputs/mapping/release/mapping.txt

  r8-device-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: gradle :app:connectedMinifiedTestAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FGallery-0.4.0-R8-instrumentation
          path: app/build/reports/androidTests/connected/
